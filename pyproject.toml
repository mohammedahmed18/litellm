[project]
name = "litellm"
version = "1.76.0"
description = "Library to easily interface with LLM API providers"
authors = [{ name = "BerriAI" }]
requires-python = ">3.9"
readme = "README.md"
license = "MIT"
dependencies = [
    "httpx",
    "openai",
    "python-dotenv",
    "tiktoken",
    "importlib-metadata",
    "tokenizers",
    "click",
    "jinja2",
    "aiohttp",
    "pydantic",
    "jsonschema",
    "codeflash",
]

[project.optional-dependencies]
proxy = [
    "gunicorn>=23.0.0,<24",
    "uvicorn>=0.29.0,<0.30",
    "uvloop>=0.21.0,<0.22 ; sys_platform != 'win32'",
    "fastapi>=0.115.5,<0.116",
    "backoff",
    "pyyaml>=6.0.1,<7",
    "rq",
    "orjson>=3.9.7,<4",
    "apscheduler>=3.10.4,<4",
    "fastapi-sso>=0.16.0,<0.17",
    "PyJWT>=2.8.0,<3",
    "python-multipart>=0.0.18,<0.0.19",
    "cryptography>=43.0.1,<44",
    "pynacl>=1.5.0,<2",
    "websockets>=13.1.0,<14",
    "boto3==1.36.0",
    "azure-identity>=1.15.0,<2",
    "azure-storage-blob>=12.25.1,<13",
    "mcp>=1.10.0,<2 ; python_version >= '3.10'",
    "litellm-proxy-extras==0.2.18",
    "litellm-enterprise==0.1.19",
    "rich",
    "polars>=1.31.0,<2 ; python_version >= '3.10'",
]
extra_proxy = [
    "prisma==0.11.0",
    "azure-identity>=1.15.0,<2",
    "azure-keyvault-secrets>=4.8.0,<5",
    "google-cloud-kms>=2.21.3,<3",
    "google-cloud-iam>=2.19.1,<3",
    "resend>=0.8.0,<0.9",
    "redisvl>=0.4.1,<0.5 ; python_version >= '3.9' and python_version < '3.14'",
]
utils = ["numpydoc"]
caching = ["diskcache>=5.6.1,<6"]
semantic-router = ["semantic-router ; python_version >= '3.9'"]
mlflow = ["mlflow>3.1.4 ; python_version >= '3.10'"]

[project.urls]
homepage = "https://litellm.ai"
Homepage = "https://litellm.ai"
repository = "https://github.com/BerriAI/litellm"
Repository = "https://github.com/BerriAI/litellm"
documentation = "https://docs.litellm.ai"
Documentation = "https://docs.litellm.ai"

[project.scripts]
litellm = "litellm:run_server"
litellm-proxy = "litellm.proxy.client.cli:cli"

[dependency-groups]
dev = [
    "flake8>=6.1.0,<7",
    "black>=23.12.0,<24",
    "mypy~=1.0",
    "pytest",
    "pytest-mock>=3.12.0,<4",
    "pytest-asyncio",
    "requests-mock>=1.12.1,<2",
    "responses>=0.25.7,<0.26",
    "respx>=0.22.0,<0.23",
    "ruff>=0.1.0,<0.2",
    "types-requests",
    "types-setuptools",
    "types-redis",
    "types-PyYAML",
    "opentelemetry-api==1.25.0",
    "opentelemetry-sdk==1.25.0",
    "opentelemetry-exporter-otlp==1.25.0",
    "langfuse>=2.45.0,<3",
    "fastapi-offline>=1.7.3,<2",
    "codeflash>=0.6.22",
]
proxy-dev = [
    "prisma==0.11.0",
    "hypercorn>=0.15.0,<0.16",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.25.0",
    "opentelemetry-sdk==1.25.0",
    "opentelemetry-exporter-otlp==1.25.0",
    "azure-identity>=1.15.0,<2",
]

[tool.uv]
default-groups = [
    "dev",
    "proxy-dev",
]

[tool.uv.sources]
codeflash = { path = "../../../work/codeflash", editable = true }


[tool.hatch.build.targets.sdist]
include = [
    "litellm",
    "litellm/py.typed",
]

[tool.hatch.build.targets.wheel]
include = [
    "litellm",
    "litellm/py.typed",
]


[tool.isort]
profile = "black"

[tool.commitizen]
version = "1.76.0"
version_files = [
    "pyproject.toml:^version"
]

[tool.mypy]
plugins = "pydantic.mypy"

[tool.codeflash]
# All paths are relative to this pyproject.toml's directory.
module-root = "litellm"
tests-root = "tests"
test-framework = "pytest"
ignore-paths = []
formatter-cmds = ["disabled"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

